    let best=null,bd=144;proj.forEach(o=>{const dd=(o.p[0]-x)**2+(o.p[1]-y)**2;if(dd<bd){bd=dd;best=o;}});
    if(best){tip.style.display='block';tip.textContent=`${best.ch} ch · ${best.fs} Hz · ${bits} bit → ${best.v.toFixed(3)}`;
      tip.style.left=(cv.offsetLeft+best.p[0]+10)+'px';tip.style.top=(cv.offsetTop+best.p[1]-10)+'px';}else tip.style.display='none';});
  cv.addEventListener('pointerleave',()=>tip.style.display='none');
  cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.5,Math.min(3,zoom*(e.deltaY<0?1.1:0.9)));draw();},{passive:false});
  cv.addEventListener('dblclick',()=>{card.classList.toggle('full');draw();});
  new IntersectionObserver((ents,ob)=>{if(ents[0].isIntersecting){draw();ob.disconnect();}}).observe(cv);
  window.addEventListener('resize',()=>{if(drawn)draw();});
});
</script></body></html>
